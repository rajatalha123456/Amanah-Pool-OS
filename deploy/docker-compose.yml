# Demo deployment of Amanah Pool OS: database, API, web app behind HTTPS. See deploy/README.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      BEHIND_TLS_PROXY: "True"
    depends_on:
      db:
        condition: service_healthy
    # No published port: the API is reachable only through Caddy.

  web:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api/v1/
        VITE_DEMO_MODE: ${DEMO_MODE:-true}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend

volumes:
  db_data:
  caddy_data:
